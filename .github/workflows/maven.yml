name: Java CI/CD Pipeline  
 on:   
  push:     
    branches: [ "master" ]  
  pull_request:
    branches: ["master" ]
  workflow_dispatch:
    
jobs:   
  build:     
    runs-on: windows-latest     
        
steps:
    -name: Checkout repository
     uses: actions/checkout@v4
   -name: Set up JDK 26 
    uses: actions/setup-java@v4          
   with:         
	 distribution: 'temurin'         
	  java-version: '26'      
     - name: Compile Java program      
     run: java new.java       
    
